services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    
  esphome:
    image: ghcr.io/esphome/esphome:2026.9.1
    ports:
      - "6052:6052"
    volumes:
      - ./esphome:/config

  timescaledb:
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_USER: valfld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: building_twin
    ports:
      - "5432:5432"
    volumes:
      - timescaledb:/var/lib/postgresql/data
      - ./sql/100_measurements.sql:/docker-entrypoint-initdb.d/100_measurements.sql

  grafana:
    image: grafana/grafana:13.1.8
    environment:
      GF_SECURITY_ADMIN_USER: valfld
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      POSTGRES_PASSWORD_GRAFANA: ${POSTGRES_PASSWORD_GRAFANA}
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  nodered:
    image: nodered/node-red:5.0.9
    environment:
      NTFY_TOPIC: ${NTFY_TOPIC}
    ports: 
      - "1880:1880"
    volumes:
      - node-red-data:/data

volumes:
  timescaledb:
  grafana-storage:
  node-red-data:

