services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    
  esphome:
    image: ghcr.io/esphome/esphome:2026.9.1
    ports:
      - "6052:6052"
    volumes:
      - ./esphome:/config

  timescaledb:
    image: timescale/timescaledb:2.30.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: valfld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD_GRAFANA: ${POSTGRES_PASSWORD_GRAFANA}
      POSTGRES_DB: building_twin
    ports:
      - "5432:5432"
    volumes:
      - timescaledb:/var/lib/postgresql/data
      - ./sql/100_measurements.sql:/docker-entrypoint-initdb.d/100_measurements.sql
      - ./sql/200_grafana_reader.sql:/docker-entrypoint-initdb.d/200_grafana_reader.sql


  grafana:
    image: grafana/grafana:13.1.8
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: valfld
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      POSTGRES_PASSWORD_GRAFANA: ${POSTGRES_PASSWORD_GRAFANA}
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  nodered:
    image: nodered/node-red:5.0.9
    restart: unless-stopped
    environment:
      NTFY_TOPIC: ${NTFY_TOPIC}
    ports: 
      - "1880:1880"
    volumes:
      - node-red-data:/data


  ingest:
    build: ./ingest
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      POSTGRES_HOST: timescaledb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - timescaledb
      - mosquitto

  simulateur:
    restart: unless-stopped
    build: ./simulateur
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto 


volumes:
  timescaledb:
  grafana-storage:
  node-red-data:

