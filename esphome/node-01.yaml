esphome:
  name: node-01          

esp32:
  board: esp32dev       
  framework:
    type: esp-idf

logger:

api:
  reboot_timeout: 0s

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: 192.168.1.74         
  port: 1883
  topic_prefix: bt/home/node-01

sensor:
  - platform: wifi_signal
    name: wifi_signal
    update_interval: 30s

  - platform: uptime
    name: uptime

  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: temperature
      state_topic: bt/home/r1-chambre-03/temperature
    pressure:
      name: pressure
      state_topic: bt/home/r1-chambre-03/pressure
    humidity:
      name: humidity
      state_topic: bt/home/r1-chambre-03/humidity
  
  - platform: scd4x
    co2:
      name: co2
      state_topic: bt/home/r1-chambre-03/co2